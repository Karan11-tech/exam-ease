<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - ExamEase</title>
  <link rel="stylesheet" href="style1.css">
  <link rel="stylesheet" href="alert.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <div class="background"></div>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="index.html#login">Login</a>
    <span class="nav-logo">
      <i class='bx bxl-xing'></i>
      <span>ExamEase</span>
    </span>
  </nav>

  <div class="container">
    <a href="index.html" id="backToLoginLink" class="back-link"><i class='bx bx-arrow-back'></i> Back to login</a>
    <h2 id="resetPageTitle">Reset Password</h2>
    <p id="resetPageSubtitle">Enter your new password below.</p>

    <form id="resetPasswordForm">
      <div class="form-group-password" style="position: relative;">
        <input type="password" id="newPassword" placeholder="Enter new password" required />
        <span class="icon-wrap"><i class='bx bxs-lock-alt'></i></span>
        <span class="toggle-password" data-target="newPassword" title="Show/hide password">👁️</span>
      </div>

      <div class="form-group-password" style="position: relative;">
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
        <span class="icon-wrap"><i class='bx bxs-lock-alt'></i></span>
        <span class="toggle-password" data-target="confirmPassword" title="Show/hide password">👁️</span>
      </div>

      <button type="submit">Reset Password</button>
      <p id="resetMessage"></p>
    </form>
  </div>

  <div id="alertBox" class="alert-box"></div>
  <script src="alert.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
