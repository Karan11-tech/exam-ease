<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - ExamEase</title>
  <link rel="stylesheet" href="style1.css" />
  <link rel="stylesheet" href="alert.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
  <div class="background"></div>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="index.html#login">Login</a>
    <span class="nav-logo">
      <i class='bx bxl-xing'></i>
      <span>ExamEase</span>
    </span>
  </nav>

  <div class="container">
    <a href="index.html" id="backToLoginLink" class="back-link"><i class='bx bx-arrow-back'></i> Back to login</a>
    <h2 id="forgotPageTitle">Forgot Password</h2>
    <p id="forgotPageSubtitle">Enter your email to receive an OTP</p>

    <form id="sendOtpForm">
      <div class="form-group-password">
        <input type="email" id="email" placeholder="Enter your email" required />
        <span class="icon-wrap"><i class='bx bxs-envelope'></i></span>
      </div>
      <button type="submit">Send OTP</button>
    </form>
    <p id="otpMessage"></p>

    <div id="otpSection" class="hidden">
      <p>Enter the OTP sent to your email:</p>
      <form id="verifyOtpForm">
        <div class="form-group-password">
          <input type="text" id="otpInput" placeholder="Enter OTP" required />
          <span class="icon-wrap"><i class='bx bxs-key'></i></span>
        </div>
        <button type="submit">Verify OTP</button>
      </form>
      <p id="verifyMessage"></p>
    </div>
  </div>

  <div id="alertBox" class="alert-box"></div>
  <script src="alert.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
